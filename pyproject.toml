[project]
name = "vacancies"
version = "0.1.0"
description = ""
authors = [
    {name = "Max Yanchuk",email = "maksim.yanchuk.01@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
isort = "^7.0.0"
black = "^25.11.0"
mypy = "^1.18.2"


[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.0.0"

[tool.black]
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'